<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AKISETOのトップページ</title>

  <!-- ★ ファビコンの設定 ★ -->
  <link rel="icon" href="img/common/AKISETO logo favicon.png" type="image/png">
  <!-- スマホのホーム画面に追加した時のアイコン設定（任意） -->
  <link rel="apple-touch-icon" href="img/common/AKISETO logo favicon.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ヘッダー（全ページ共通） -->
  <header class="header">
    <div class="header-inner">
      <h1 class="logo">
        <a href="index.html">
          <img src="img/common/AKISETO logo mark.png" alt="AKISETO">
        </a>
      </h1>

      <!-- ハンバーガーボタン -->
      <button class="hamburger" id="js-hamburger" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- ナビゲーションメニュー -->
      <nav class="nav" id="js-nav">
        <!-- ドロワーメニュー用のロゴ -->
        <div class="nav-logo">
          <img src="img/common/AKISETO logo mark.png" alt="AKISETO">
        </div>

        <ul>
          <li><a href="index.html"><img src="img/common/icon_top.png" alt=""><span>トップページ</span></a></li>
          <li><a href="menu.html"><img src="img/common/icon_menu.png" alt=""><span>メニュー</span></a></li>
          <li><a href="stores.html"><img src="img/common/icon_map.png" alt=""><span>店舗情報</span></a></li>
          <li><a href="news.html"><img src="img/common/icon_news.png" alt=""><span>お知らせ</span></a></li>
          <li><a href="contact.html"><img src="img/common/icon_contact.png" alt=""><span>お問い合わせ</span></a></li>
        </ul>
      </nav>
    </div>
  </header>

 <!-- メニューページのサブヒーロー（上部ビジュアル） -->
  <section class="sub-hero">
    <div class="sub-hero-bg">
      <img src="img/common/AKISETO News.png" alt="お知らせ画像背景">
    </div>

    <div class="sub-hero-inner">
      <img src="img/common/News inner.png" alt="お知らせ" class="sub-hero-title-img">
    </div>
  </section>

  <!-- メインコンテンツエリア -->
  <main class="news-detail-main">
    <div class="news-detail-container">

      <!-- メイン写真 -->
      <div class="news-detail-img">
        <img src="img/news/カープ パブリックビューイング.png" alt="カープ戦パブリックビューイング様子">
      </div>

      <!-- 本文エリア -->
      <div class="news-detail-content">
        <p>2026年8月6日に広島駅北店にて広島東洋カープvs東京読売ジャイアンツのパブリックビューイングを行います。</p>
        <p>ご予約にて承っております。</p>
        <p>座席数によってはご案内できない場合がございます。ご了承ください。</p>
        <p>なお、本通り店は通常営業です。</p>
      </div>

      <!-- 案内ボタンエリア -->
      <div class="news-detail-btn-wrap">
        <a href="stores.html" class="store-info-btn">店舗情報はこちら</a>
        <a href="news.html" class="back-news-btn">お知らせ一覧へ戻る</a>
      </div>

    </div>
  </main>

<!-- フッター（index除く全ページ共通） -->
  <footer class="footer">
    <div class="footer-bg">
     <img src="img/common/footer.png" alt="店内イメージ">
    </div>
    <div class="footer-logo">
      <a href="index.html">
        <img src="img/common/footer_logo.png" alt="AKISETO">
      </a>
    </div>
  </footer>

  <!-- ページトップへ戻るボタン -->
  <button type="button" class="page-top-btn" id="js-pagetop" aria-label="ページ上部へ戻る">
     <img src="img/common/btn_pagetop.png" alt="上へ">
  </button>

  <!-- 共通JavaScriptの読み込み -->
  <script src="js/main.js"></script>
</body>
</html>
